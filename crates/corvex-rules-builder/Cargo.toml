clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
walkdir.workspace = true

[dev-dependencies]
indexmap = { workspace = true }
