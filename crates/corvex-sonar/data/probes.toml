[[probe]]
id = "etcd_version"
ports = [2379, 2380]
payload = "GET /version HTTP/1.1\r\nHost: {host}\r\nUser-Agent: Corvex/1.0\r\nAccept: application/json\r\nConnection: close\r\n\r\n"
rarity = 5
wait_ms = 3000
fingerprints = ["etcd.response"]
hint = "http"

[[probe]]
id = "dns_version_bind"
ports = [53]
# DNS-over-TCP query for "version.bind" TXT in CHAOS class.
# RFC 1035 frame = 2-byte length + 12-byte header + question.
# Bytes:
#   001E                               length = 30
#   0001 0120 0001 0000 0000 0000      header (qid, RD flag, qdcount=1)
#   07 76 65 72 73 69 6f 6e            "version"
#   04 62 69 6e 64                     "bind"
#   00                                 root
#   0010 0003                          QTYPE=TXT QCLASS=CHAOS
payload_hex = "001E00010120000100000000000007 76 65 72 73 69 6f 6e 04 62 69 6e 64 00 00 10 00 03"
rarity = 7
wait_ms = 3000
fingerprints = ["dns.version"]
hint = "dns"
