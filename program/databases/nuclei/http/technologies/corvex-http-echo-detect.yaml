id: corvex-http-echo-detect

info:
  name: HTTP echo server detection
  author: corvex
  severity: info
  description: |
    Detects unauthenticated HTTP echo / debug endpoints that reflect the
    full request back in the response body. Shipped as a smoke-test
    template so the Nuclei engine has at least one supported template
    to load in dev environments where the full upstream bundle hasn't
    been fetched yet.
  tags: tech,corvex,echo
  reference:
    - https://github.com/projectdiscovery/nuclei-templates

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: or
    matchers:
      - type: word
        name: echo-header
        part: header
        words:
          - "X-Corvex-Echo"
      - type: word
        name: echo-body
        part: body
        words:
          - "corvex-echo-server"
