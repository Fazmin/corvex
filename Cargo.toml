[workspace]
resolver = "2"
members = [
    "crates/corvex",
    "crates/corvex-core",
    "crates/corvex-nuclei",
    "crates/corvex-plugins",
    "crates/corvex-sonar",
    "crates/corvex-proxy",
    "crates/corvex-intel",
    "crates/corvex-checks",
    "crates/corvex-desktop",
    "crates/vulndb-builder",
    "crates/corvex-rules-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-only"
repository = "https://github.com/sullo/corvex"
description = "Rust port of the Corvex web vulnerability scanner"

[workspace.dependencies]
corvex-core = { path = "crates/corvex-core" }
corvex-nuclei = { path = "crates/corvex-nuclei" }
corvex-plugins = { path = "crates/corvex-plugins" }
corvex-sonar = { path = "crates/corvex-sonar" }
corvex-proxy = { path = "crates/corvex-proxy" }
corvex-intel = { path = "crates/corvex-intel" }
corvex-checks = { path = "crates/corvex-checks" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"

clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1.3" }
csv = "1"
regex = "1"
url = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
once_cell = "1"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
futures = "0.3"
hostname = "0.4"
dns-lookup = "2"
hickory-resolver = "0.25"
indexmap = { version = "2", features = ["serde"] }
xml-rs = "0.8"
scraper = "0.20"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"] }
quick-xml = { version = "0.38", features = ["serialize"] }
toml_crate = { package = "toml", version = "0.8" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
fancy-regex = "0.13"
hex = "0.4"
serde_yaml = "0.9"
zip = "2"
tar = "0.4"
flate2 = "1"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
